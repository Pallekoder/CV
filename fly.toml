# Fly.io: one small always-on machine with a persistent volume for the world.
# `deploy/fly.sh` fills in the app name and creates the volume and secret.
app = "the-world"
primary_region = "ams"

[build]

[env]
  WORLD_LAW = "corner"
  WORLD_BEINGS = "12"
  WORLD_SPEED = "4"

[mounts]
  source = "world_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
